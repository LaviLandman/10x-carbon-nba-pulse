<!DOCTYPE html>
<html lang="en" data-carbon-theme="g10">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courtside Pulse - NBA News & Updates Hub (IBM Carbon Design)</title>

  <!-- Google Fonts: IBM Plex Sans & IBM Plex Mono (Official Carbon Typefaces) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- IBM Carbon Design System CSS (v11) -->
  <link rel="stylesheet" href="css/carbon-styles.min.css">

  <!-- SVG Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%230f62fe'/><path d='M16 2a14 14 0 1 0 14 14A14 14 0 0 0 16 2zm12 13a12 12 0 0 0-3.3-8.3A12.1 12.1 0 0 1 17 15zm-13 0a12.1 12.1 0 0 1-7.7-8.3A12 12 0 0 0 4 15zm0 2H4a12 12 0 0 0 3.3 8.3A12.1 12.1 0 0 1 15 17zm2 0a12.1 12.1 0 0 1 7.7 8.3A12 12 0 0 0 28 17z' fill='white'/></svg>">

  <style>
    /* Baseline layout positioning for Carbon fixed header and side nav */
    body {
      margin: 0;
      padding: 0;
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      background-color: var(--cds-background, #f4f4f4);
      color: var(--cds-text-primary, #161616);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Fixed top header spacing */
    .app-main-layout {
      display: flex;
      padding-top: 3rem; /* 48px Header height */
      min-height: calc(100vh - 3rem);
    }

    #side-nav-container {
      width: 16rem; /* 256px */
      flex-shrink: 0;
    }

    #app-side-nav {
      position: fixed;
      top: 3rem;
      left: 0;
      width: 16rem;
      height: calc(100vh - 3rem);
      overflow-y: auto;
      z-index: 100;
      border-right: 1px solid var(--cds-border-subtle, #e0e0e0);
      background-color: var(--cds-layer-01, #ffffff);
      transition: transform 0.2s ease-in-out;
    }

    .app-content-wrapper {
      flex: 1;
      padding: 2rem 2.5rem;
      max-width: 1400px;
      margin: 0 auto;
      overflow-x: hidden;
    }

    @media (max-width: 1056px) {
      #app-side-nav {
        transform: translateX(-100%);
      }
      #app-side-nav.cds--side-nav--expanded {
        transform: translateX(0);
      }
      #side-nav-container {
        width: 0;
      }
      .app-content-wrapper {
        padding: 1.5rem 1rem;
      }
    }
  </style>
</head>

<body class="cds--theme--g10">
  <!-- IBM Carbon Header -->
  <div id="header-container"></div>

  <div class="app-main-layout">
    <!-- IBM Carbon Side Nav -->
    <div id="side-nav-container"></div>

    <!-- Main Content Area -->
    <main class="app-content-wrapper" id="main-content" tabindex="-1">
      <!-- Search & Multi-facet Filter Toolbar -->
      <section id="filters-container"></section>

      <!-- Main Layout Grid: Feed + Widgets or Full Data Table -->
      <section id="view-container"></section>
    </main>
  </div>

  <!-- IBM Carbon Modal Container -->
  <div id="modal-container"></div>

  <!-- IBM Carbon Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Main Application Script (Bundled IIFE for native file:// and http:// support) -->
  <script src="js/bundle.js"></script>
</body>
</html>
